<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QueueLess Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>
body{display:grid;place-items:center;padding:20px}.admin-login{background:#fff;padding:35px;border-radius:20px;width:min(100%,420px);box-shadow:0 15px 45px #39226315}.admin-login h1{color:#35234f;margin:18px 0 8px}.admin-login p{color:#777084;line-height:1.5}.admin-login label{display:block;font-weight:700;font-size:13px;margin:22px 0 8px}.admin-login input{width:100%;height:48px;border:1px solid #ddd4e9;border-radius:10px;padding:0 13px}.admin-login button{width:100%;margin-top:16px}.flash-message{padding:11px;background:#fff0f0;color:#a12f3b;border-radius:9px;margin-top:14px}.back{display:block;margin-top:20px;color:#68449e;text-decoration:none;text-align:center}
</style></head><body><main class="admin-login">
<div class="brand dark-brand"><span class="brand-icon">Q</span><span>QueueLess</span></div>
<h1>Admin portal</h1><p>Sign in to manage department queues and service flow.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash-message">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><label for="password">Admin password</label><input id="password" type="password" name="password" placeholder="Enter admin password" required autofocus><button class="submit-btn" type="submit">Sign in to dashboard →</button></form>
<a class="back" href="{{ url_for('home') }}">← Back to student portal</a>
</main></body></html>
